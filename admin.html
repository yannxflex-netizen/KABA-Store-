<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Administration – KABA-Store</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header><div class="wrap"><a class="logo" href="index.html">KABA-Store</a><a href="index.html">Voir le site</a></div></header>

<main class="wrap">

<section id="login" class="box" style="max-width:420px;margin:40px auto">
<h2>Connexion administrateur</h2>
<form id="lform">
<label>E-mail<input id="email" type="email" autocomplete="username" required></label>
<label>Mot de passe<input id="pass" type="password" autocomplete="current-password" required></label>
<button class="cta" type="submit" style="width:100%">Se connecter</button>
<p id="lmsg" class="err" role="alert"></p>
</form>
</section>

<section id="panel" hidden>
<p>Connecté : <b id="who"></b> <button class="sm" id="logout" type="button">Se déconnecter</button></p>

<div class="box">
<h2 id="ftitle">Publier un produit</h2>
<form id="pform">
<label>Nom du produit<input id="name" required placeholder="Ex : Samsung Galaxy A15 128 Go"></label>
<label>Catégorie<select id="cat"><option>Téléphones</option><option>Accessoires</option></select></label>
<label>Marque (facultatif)<input id="brand" list="brands" placeholder="Ex : iPhone, Samsung, Tecno"><datalist id="brands"><option value="iPhone"><option value="Samsung"><option value="Tecno"><option value="Infinix"><option value="Xiaomi"><option value="Itel"><option value="Oppo"><option value="Huawei"></datalist></label>
<label>État du téléphone<select id="state"><option value="">Non précisé</option><option>Neuf</option><option>Occasion</option><option>Reconditionné</option></select></label>
<label>Prix en FCFA<input id="price" type="number" min="0" step="500" required placeholder="Ex : 95000"></label>
<label>Ancien prix en FCFA (facultatif, pour afficher une promo)<input id="old" type="number" min="0" step="500" placeholder="Ex : 120000"></label>
<label>Description<textarea id="desc" rows="3" placeholder="Stockage, état, couleur, garantie…"></textarea></label>
<label>Photos (5 maximum)<input id="photo" type="file" accept="image/*" multiple></label>
<label class="chk"><input id="sold" type="checkbox"> Marquer comme vendu</label>
<label class="chk"><input id="feat" type="checkbox"> Mettre en vedette (en haut du catalogue)</label>
<div id="prev" class="thumbs"></div>
<button class="cta" id="save" type="submit" style="width:100%">Publier</button>
<button class="alt" id="cancel" type="button" hidden>Annuler la modification</button>
<p id="fmsg" role="status"></p>
</form>
</div>

<div class="box">
<h2>Vos produits (<span id="n">0</span>)</h2>
<div id="plist"><p class="empty">Aucun produit pour l’instant.</p></div>
</div>
</section>

</main>
<script type="module" src="admin.js"></script>
</body>
</html>
